[package]
name = "tinyflows-storage"
version = "0.1.0"
edition.workspace = true
rust-version = "1.89"
license.workspace = true
repository.workspace = true
publish = false
description = "TinyFlows-owned generic document persistence helpers"

[dependencies]
tinystoragedrivers-api = { git = "https://github.com/tinyhumansai/tinystoragedrivers", version = "2.1.3", rev = "f5a33025b9feaa36fea522cce764fe8c796e5139" }
tinystoragedrivers-types = { git = "https://github.com/tinyhumansai/tinystoragedrivers", version = "2.1.3", rev = "f5a33025b9feaa36fea522cce764fe8c796e5139" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
sha2 = "0.11"
ulid = "3"
data-encoding = "2"

[dev-dependencies]
tinystoragedrivers-testkit = { git = "https://github.com/tinyhumansai/tinystoragedrivers", version = "2.1.3", rev = "f5a33025b9feaa36fea522cce764fe8c796e5139" }
tinystoragedrivers-busproxy = { git = "https://github.com/tinyhumansai/tinystoragedrivers", version = "2.1.3", rev = "f5a33025b9feaa36fea522cce764fe8c796e5139" }
# Keep this on the rev tinystoragedrivers pins so `tinybus::Connection` is one type with its busproxy.
tinybus-sdk = { package = "tinybus", git = "https://github.com/tinyhumansai/tinybus", rev = "106eda127f8a40c0ba401efc0074667e43d4c52e", default-features = false }
