# SQLite implementations of the tinyflows catalog and of the engine's
# checkpoint store.
#
# Split from `tinyflows-catalog` on purpose: the catalog is the vocabulary, this
# is one backend for it. A host with its own database takes the catalog crate
# and leaves this one, and neither the model nor the engine grows a rusqlite
# dependency because this crate exists.
#
# Every entry point takes a directory path, never a host config type. The
# databases (`flows.db`, `checkpoints.db`) and the JSON draft files are created
# under it on first use.
[package]
name = "tinyflows-sqlite"
version = "0.1.0"
description = "SQLite-backed flow catalog, draft store and graph checkpointer for tinyflows"
edition.workspace = true
# The SQLite driver this crate opens its databases through needs 1.88.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[dependencies]
tinyflows = { workspace = true, optional = true }
tinyflows-catalog = { version = "0.1.0", path = "../tinyflows-catalog", optional = true }
tinyflows-schedule = { version = "0.1.0", path = "../tinyflows-schedule" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1.0"
async-trait = { workspace = true, optional = true }
# `checkpoint` only: every SQLite call is a blocking one, moved off the async
# executor with `spawn_blocking` rather than held on it.
tokio = { workspace = true, optional = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
# `flows.db` and `jobs.db` open through the SQLite driver's native mode: the
# driver owns the per-file connection (shared with any other handle on the
# same file in the process), this crate keeps its own tables and SQL. Named by
# git tag so a host that vendors the storage crates once can `[patch]` it.
tinystoragedrivers-sqlite = { git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v0.5.0" }
uuid = { workspace = true }
# Diagnostics only: what was written, skipped, or found corrupt on disk.
tracing = { workspace = true }

[features]
# `catalog` is the flow catalog, drafts, checkpointer and state store; it is the
# half that needs the engine (`tinyflows`). `schedule` (the cron job/run store)
# needs only `tinyflows-schedule`, so a host that runs scheduled jobs but no
# flows can build with `default-features = false, features = ["schedule"]` and
# pull neither the engine nor its expression stack.
default = ["catalog", "schedule"]
catalog = ["dep:tinyflows", "dep:tinyflows-catalog", "dep:async-trait", "dep:tokio"]
schedule = []
# Off by default; exposes the two fixture-only writers (`force_run_status_for_test`,
# `force_corrupt_graph_json_for_test`) that stage states no production path can
# produce — a terminal run flipped back to `running`, a `graph_json` column that
# does not deserialize. They are always available inside this crate's own tests;
# the feature is what lets a *host*'s test suite stage the same states without a
# weaker production write existing for it.
test-fixtures = ["catalog"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
