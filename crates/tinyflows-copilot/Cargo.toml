# The authoring copilot: what to tell a model that is building a workflow, and
# how to phrase the turn that asks it.
#
# This is the half of a flow-authoring assistant that does not depend on which
# harness runs it. The standing prompts teach the graph DSL, the node
# vocabulary, the binding syntax and the propose-only persistence contract —
# all facts about tinyflows, not about a host — and `builder` turns one
# authoring request into the brief that opens a turn.
#
# What is deliberately absent is the harness. This crate names no tool trait, no
# agent registry and no model client: it produces strings and parses requests,
# and a host wires that to whatever runs its turns. That is what lets the same
# copilot brief drive a desktop panel, a remote orchestrator and a CLI without
# any of them agreeing on an agent framework.
[package]
name = "tinyflows-copilot"
version = "0.1.0"
description = "Prompt and turn-brief construction for a tinyflows authoring copilot, independent of any agent harness"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
# The tool belt names `tinytools` by git rev (it is not on crates.io), and a
# published package cannot carry a git dependency. Only `tinyflows` is released.
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tinyflows = { workspace = true, features = ["mock"] }
tinyflows-catalog = { version = "0.1.0", path = "../tinyflows-catalog" }
async-trait = { workspace = true }
anyhow = "1.0"
chrono = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# The shared agent `Tool` trait. A git source rather than a path on purpose,
# matching tinywallet and tinymcp: a host that already links tinytools (OpenHuman,
# through tinyagents) patches this exact URL to its own copy, so the two unify
# into one package and `tinytools::Tool` stays one type. Keep the rev equal to the
# tinytools gitlink tinyagents pins.
tinytools = { git = "https://github.com/tinyhumansai/tinytools", rev = "41cc80ac9acf37a14f20be94f60ee552749f1540" }

[dev-dependencies]
tokio = { workspace = true }
