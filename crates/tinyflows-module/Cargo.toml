[package]
name = "tinyflows-module"
version = "0.1.0"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
publish = false
description = "Loadable TinyBus module for workflow authoring and scheduling"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tinyflows-drivers = { path = "../tinyflows-drivers", default-features = false, features = ["catalog", "engine", "schedule"] }
tinyflows-catalog = { path = "../tinyflows-catalog" }
tinystoragedrivers-api = { git = "https://github.com/tinyhumansai/tinystoragedrivers", version = "2.1.2", rev = "6226b9484c8bd01c58741718cd89ba90a13a36bb" }
tinystoragedrivers-types = { git = "https://github.com/tinyhumansai/tinystoragedrivers", version = "2.1.2", rev = "6226b9484c8bd01c58741718cd89ba90a13a36bb" }
tinyflows-storage = { path = "../tinyflows-storage" }
tinyflows-schedule = { path = "../tinyflows-schedule" }
anyhow = "1"
chrono.workspace = true
async-trait.workspace = true
serde.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tinyflows = { workspace = true, features = ["mock"] }
tinyflows-bus = { path = "../tinyflows-bus" }
tinyflows-copilot = { path = "../tinyflows-copilot" }
tinytools = { git = "https://github.com/tinyhumansai/tinytools", rev = "41cc80ac9acf37a14f20be94f60ee552749f1540" }
tinybus = { version = ">=0.3.6, <0.4", default-features = false, features = ["macros", "modules"] }
tinybus-module = ">=0.3.6, <0.4"
serde_json.workspace = true

[features]
default = []
# Swap the C ABI exports for a Rust `linked_module()` so a host can link the
# module into its own executable (several linked modules can then coexist).
static-link = []

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tinystoragedrivers-testkit = { git = "https://github.com/tinyhumansai/tinystoragedrivers", version = "2.1.2", rev = "6226b9484c8bd01c58741718cd89ba90a13a36bb" }
