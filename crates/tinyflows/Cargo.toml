[package]
name = "tinyflows"
version = "0.8.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "A Rust-based workflow management solution."
readme = "README.md"
repository = "https://github.com/tinyhumansai/tinyflows"
homepage = "https://github.com/tinyhumansai/tinyflows"
documentation = "https://docs.rs/tinyflows"
keywords = ["automation", "workflow", "orchestration", "pipeline"]
categories = ["development-tools"]
# Anchored with a leading `/` so a bare name like `README.md` doesn't also match
# nested files (e.g. the gitignored `local/**/README.md`) and leak them into the
# published package.
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
futures-timer = "3"
futures-util = { version = "0.3", default-features = false, features = ["async-await", "sink", "std"] }
getrandom = "0.4"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json"], optional = true }
# `caps::host` only: hashing an author-supplied state key (and namespace) into
# one safe path component, and staging a script in a temporary directory.
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
# `store` only: the advisory file lock that keeps two processes from deciding
# the same proposal at once.
fs2 = { version = "0.4", optional = true }
# `graph-debug` only: self-contained raster output and a tiny bitmap font. The
# renderer deliberately does not shell out to Graphviz, so it works anywhere
# the library does.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
font8x8 = { version = "0.3", default-features = false, features = ["unicode"], optional = true }
jaq-core = "3.1.0"
jaq-std = { version = "3.0.1", default-features = false }
jaq-json = { version = "2.0.1", features = ["serde"] }

[features]
# Off by default; enables in-memory mock capability impls for downstream tests
# and examples. Mocks are always available inside this crate's own tests.
default = []
mock = []
# Off by default; enables `caps::host` — ready-made capability implementations
# for a host that runs scripts as child processes of itself and keeps state on
# its own disk. Off by default because a host with a sandbox wants none of it,
# and because it is the only thing in the crate that spawns a process or writes
# a file. Always available inside this crate's own tests.
host-caps = ["dep:reqwest", "dep:sha2", "dep:tempfile", "reqwest/rustls", "tokio/fs", "tokio/process", "tokio/io-util"]
# Off by default; enables `store` — the durable model around a graph (versioned
# documents, run records, notes, proposals) and a JSON file-backed store for it.
# A host with its own catalog or database wants none of it, so it is not part of
# the engine. Always available inside this crate's own tests.
store = ["dep:sha2", "dep:fs2"]
# A file-writing graph visualizer intended for development and diagnostics.
graph-debug = ["dep:image", "dep:font8x8"]
# Off by default; enables `testkit` — programmable capability mocks, a
# structured run trace, and live step-debugging (breakpoints, inspection,
# output override) driven from another task. Adds no dependencies: tokio,
# futures-timer, async-trait and jaq are already required by the engine. The
# engine's interception seam itself is always compiled and inert; this feature
# only switches on the implementation that uses it. Always available inside
# this crate's own tests, like `store` and `mock`.
testkit = []

[dev-dependencies]
proptest = "1"
# `caps::host` compiles inside this crate's own tests whether or not the
# `host-caps` feature is on (the same rule `caps::mock` follows), so what that
# feature would switch on has to be present for a test build too. An optional
# dependency is not activated by `cfg(test)`, hence these.
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["fs", "process", "io-util"] }
