# Virtual workspace root — there is no root package.
#
# Every crate in this repository lives under `crates/`, one directory per
# package, each directory named for the package it holds. The engine a host
# depends on is `crates/tinyflows`, the same as any other member: keeping the
# root virtual is what makes that uniform, and what lets a new crate join the
# workspace by existing rather than by editing a list.
#
# This mirrors the layout every other `tiny*` repository uses (tinymemory,
# tinydocs, tinyvoice, tinywallet), so a reader who knows one knows them all.
[workspace]
resolver = "2"
members = ["crates/*"]

# `worktrees/` holds `git worktree` checkouts of this same repository. Each one
# contains a full copy of this manifest and every crate under it, so without
# this entry cargo walks into them and reports duplicate packages.
exclude = ["worktrees", "vendor/tinybus"]

# Pin unpublished module APIs to a source available in non-recursive clones and archives.
[patch.crates-io]
tinybus = { git = "https://github.com/tinyhumansai/tinybus", rev = "6ce06bc674e4f4d718aa51e643ef62c1f372e270" }
tinybus-module = { git = "https://github.com/tinyhumansai/tinybus", rev = "6ce06bc674e4f4d718aa51e643ef62c1f372e270" }

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/tinyhumansai/tinyflows"
homepage = "https://github.com/tinyhumansai/tinyflows"

[workspace.dependencies]
tinyflows = { version = "0.9.4", path = "crates/tinyflows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
