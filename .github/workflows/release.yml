name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to release
        type: choice
        required: true
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-rust:
    name: Release Rust Crate
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      next_version: ${{ steps.version.outputs.next_version }}
    env:
      CRATE_NAME: tinyflows
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Build vendored code without leaving the write-capable release token
          # in git config. The push step authenticates only its two git calls.
          persist-credentials: false
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(cargo metadata --format-version 1 --no-deps | jq -r --arg crate "$CRATE_NAME" '.packages[] | select(.name == $crate) | .version')"
          if [[ -z "$current_version" ]]; then
            echo "Could not resolve current version for crate $CRATE_NAME" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current_version"
          case "${{ inputs.bump }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported bump: ${{ inputs.bump }}" >&2
              exit 1
              ;;
          esac

          next_version="${major}.${minor}.${patch}"
          tag="v${next_version}"

          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists" >&2
            exit 1
          fi

          {
            echo "current_version=${current_version}"
            echo "next_version=${next_version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Update crate version
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          # The root Cargo.toml is a virtual workspace with no [package]
          # section (the `crates/` restructure moved the engine crate out
          # of the root manifest) — the released package's own manifest is
          # the one that carries a version to bump.
          perl -0pi -e 's/(\[package\][\s\S]*?\nversion = ")[^"]+(")/$1$ENV{NEXT_VERSION}$2/' crates/tinyflows/Cargo.toml
          # The workspace dependency every sibling crate inherits pins a
          # version too; left behind, a minor or major bump no longer matches
          # it and `cargo update --precise` cannot resolve.
          perl -pi -e 's/^(tinyflows = \{ version = ")[^"]+(", path = "crates\/tinyflows" \})/$1$ENV{NEXT_VERSION}$2/' Cargo.toml
          grep -qx "tinyflows = { version = \"${NEXT_VERSION}\", path = \"crates/tinyflows\" }" Cargo.toml
          cargo update -p "$CRATE_NAME" --precise "$NEXT_VERSION"

      - name: Commit version bump and tag
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml crates/tinyflows/Cargo.toml Cargo.lock
          git commit -m "Release ${RELEASE_TAG}"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"

      - name: Package crate
        run: cargo package --locked -p "$CRATE_NAME"

      - name: Push release commit and tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${RELEASE_TAG}"

      - name: Publish to crates.io
        run: cargo publish --locked -p "$CRATE_NAME"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Build the loadable module after the existing manual crate release succeeds.
  # Distribution-specific artifacts retain their own module digest, and a
  # release-level checksum manifest pins the complete eleven-platform set.
  native-bundles:
    name: Module bundle (${{ matrix.id }})
    needs: publish-rust
    strategy:
      # One unavailable runner should not cost the other ten artifacts; the
      # asset-count check in `github-release` is what refuses a partial set.
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-22.04-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - id: ubuntu-22.04-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - id: ubuntu-24.04-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - id: ubuntu-24.04-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - id: macos-15-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - id: macos-15-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - id: macos-26-x86_64
            os: macos-26-intel
            target: x86_64-apple-darwin
          - id: macos-26-arm64
            os: macos-26
            target: aarch64-apple-darwin
          - id: windows-2022-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - id: windows-2025-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - id: windows-11-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag the version job just created, so the artifact matches the
          # released source rather than whatever `main` has moved on to.
          ref: ${{ needs.publish-rust.outputs.tag }}
          persist-credentials: false
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      # rust-cache's default key only knows OS family and CPU arch, so the
      # ubuntu-22.04 and ubuntu-24.04 legs of this matrix shared one cache.
      # A build script compiled on 24.04 (glibc 2.39) was restored onto the
      # 22.04 runner (glibc 2.35) and failed to start (waproto, v0.1.9).
      # Keying on the bundle id keeps every distro's artifacts separate.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.id }}

      # The whole point of the per-distro matrix is that each `id` describes the
      # machine the artifact was built on. A runner image that silently changed
      # architecture would produce a correctly-named artifact that cannot load.
      - name: Verify native Rust target
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          actual_target="$(rustc -vV | sed -n 's/^host: //p')"
          [[ "$actual_target" == "$EXPECTED_TARGET" ]]

      - name: Build installable module
        run: cargo build --locked --release --package tinyflows-module

      - name: Verify Unix native module through TinyBus
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) module="$PWD/target/release/libtinyflows_module.so" ;;
            macOS) module="$PWD/target/release/libtinyflows_module.dylib" ;;
            *) echo "unsupported Unix runner: ${RUNNER_OS}" >&2; exit 1 ;;
          esac
          TINYFLOWS_MODULE_ARTIFACT="$module" bash scripts/verify-module-artifact.sh

      - name: Verify Windows native module through TinyBus
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # TinyBus refuses a module whose directory grants write to other
          # principals; the checkout's target/ inherits "Users: write" from the
          # runner workspace. Verify a copy staged in a private directory.
          $stage = Join-Path $env:RUNNER_TEMP 'tinyflows-module-verify'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          # Name the token's own SID: $env:USERNAME is not always the account
          # the process runs as. Rewrite the DACL as protected (no inherited
          # entries) with only the current user, SYSTEM and Administrators.
          $me = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $acl = New-Object System.Security.AccessControl.DirectorySecurity
          $acl.SetAccessRuleProtection($true, $false)
          $acl.SetOwner($me)
          $inherit = [Security.AccessControl.InheritanceFlags]'ContainerInherit,ObjectInherit'
          $none = [Security.AccessControl.PropagationFlags]::None
          foreach ($sid in @($me, (New-Object Security.Principal.SecurityIdentifier 'S-1-5-18'), (New-Object Security.Principal.SecurityIdentifier 'S-1-5-32-544'))) {
            $acl.AddAccessRule((New-Object Security.AccessControl.FileSystemAccessRule($sid, 'FullControl', $inherit, $none, 'Allow')))
          }
          Set-Acl -Path $stage -AclObject $acl
          icacls $stage
          Copy-Item 'target/release/tinyflows_module.dll' $stage
          $env:TINYFLOWS_MODULE_ARTIFACT = (Resolve-Path (Join-Path $stage 'tinyflows_module.dll')).Path
          bash scripts/verify-module-artifact.sh
          if ($LASTEXITCODE -ne 0) { throw "native module loader verification failed" }

      - name: Assemble Unix module package
        if: ${{ runner.os != 'Windows' }}
        id: unix_package
        shell: bash
        env:
          BUNDLE_ID: ${{ matrix.id }}
          VERSION: ${{ needs.publish-rust.outputs.next_version }}
        run: |
          set -euo pipefail

          library_name="tinyflows_module"
          case "$RUNNER_OS" in
            Linux) module="target/release/lib${library_name}.so" ;;
            macOS) module="target/release/lib${library_name}.dylib" ;;
            *) echo "unsupported Unix runner: ${RUNNER_OS}" >&2; exit 1 ;;
          esac
          package_name="tinyflows-module-${VERSION}-${BUNDLE_ID}"
          package_root="dist/${package_name}"
          mkdir -p "$package_root"
          install -m 755 "$module" "$package_root/"
          install -m 644 LICENSE README.md "$package_root/"
          # The in-archive digest is the module's own; the release-level
          # `checksum.toml` covers the archives. The host checks both.
          module_name="$(basename "$module")"
          # macOS runners don't ship GNU coreutils' `sha256sum`; only `shasum`
          # is guaranteed. Prefer `sha256sum` where it exists (Linux) and fall
          # back to `shasum -a 256` (macOS) rather than assuming either.
          if command -v sha256sum >/dev/null 2>&1; then
            module_hash="$(sha256sum "$package_root/$module_name" | awk '{print $1}')"
          else
            module_hash="$(shasum -a 256 "$package_root/$module_name" | awk '{print $1}')"
          fi
          printf '"%s" = "%s"\n' "$module_name" "$module_hash" \
            > "$package_root/modules.toml"
          tar -C "$package_root" -czf "dist/${package_name}.tar.gz" .
          echo "archive=dist/${package_name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Assemble Windows module package
        if: ${{ runner.os == 'Windows' }}
        id: windows_package
        shell: pwsh
        env:
          BUNDLE_ID: ${{ matrix.id }}
          VERSION: ${{ needs.publish-rust.outputs.next_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $libraryName = 'tinyflows_module'
          $module = "target/release/$libraryName.dll"
          $packageName = "tinyflows-module-$env:VERSION-$env:BUNDLE_ID"
          $packageRoot = "dist/$packageName"
          New-Item -ItemType Directory -Force $packageRoot | Out-Null
          Copy-Item -LiteralPath $module, 'LICENSE', 'README.md' -Destination $packageRoot
          $hash = (Get-FileHash -LiteralPath $module -Algorithm SHA256).Hash.ToLowerInvariant()
          $moduleName = Split-Path -Leaf $module
          "`"$moduleName`" = `"$hash`"`n" |
            Set-Content -Path "$packageRoot/modules.toml" -Encoding utf8NoBOM
          Compress-Archive -Path "$packageRoot/*" -DestinationPath "dist/$packageName.zip"
          "archive=dist/$packageName.zip" >> $env:GITHUB_OUTPUT

      - name: Upload Unix module package
        if: ${{ runner.os != 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: tinyflows-module-${{ matrix.id }}
          path: ${{ steps.unix_package.outputs.archive }}
          if-no-files-found: error

      - name: Upload Windows module package
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v7
        with:
          name: tinyflows-module-${{ matrix.id }}
          path: ${{ steps.windows_package.outputs.archive }}
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs:
      - publish-rust
      - native-bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-rust.outputs.tag }}
          persist-credentials: false
          submodules: true

      - name: Download workflow artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tinyflows-module-*
          path: release-assets
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable

      # TinyBus writes the manifest the host compares against, so the format
      # cannot drift from what the loader parses. `fail-fast: false` above means
      # a missing runner yields a partial set — refuse it rather than publish a
      # release some platforms silently cannot install from.
      - name: Create release checksum manifest with TinyBus
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            find release-assets -type f \
              \( -name '*.tar.gz' -o -name '*.zip' \) \
              | sort
          )
          if [[ ${#assets[@]} -ne 11 ]]; then
            printf 'expected 11 module archives, found %s:\n' "${#assets[@]}" >&2
            find release-assets -type f -print >&2 || true
            exit 1
          fi
          checksum_args=()
          for asset in "${assets[@]}"; do checksum_args+=(--path "$asset"); done
          cargo run --manifest-path vendor/tinybus/Cargo.toml --locked \
            --package tinybus --all-features --bin tinybus -- \
            modules checksum "${checksum_args[@]}" --output release-assets/checksum.toml

      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish-rust.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t release_files < <(find release-assets -type f | sort)
          if is_draft="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft)"; then
            # Retry an interrupted upload/verification without changing a
            # release that has already become public.
            [[ "$is_draft" == true ]]
            gh release upload "$RELEASE_TAG" "${release_files[@]}" --repo "$REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${release_files[@]}" \
              --repo "$REPOSITORY" \
              --verify-tag \
              --draft \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      # Draft assets need authenticated download. Verify uploaded bytes while
      # the release is private; a broken archive/module must never be published.
      - name: Verify the uploaded draft module through TinyBus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish-rust.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.publish-rust.outputs.next_version }}
        run: |
          set -euo pipefail
          archive="tinyflows-module-${VERSION}-ubuntu-24.04-x86_64.tar.gz"
          verification_dir="$PWD/target/release-verification"
          mkdir -p "$verification_dir"
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" \
            --pattern "$archive" --pattern checksum.toml --dir "$verification_dir" --clobber
          cmp release-assets/checksum.toml "$verification_dir/checksum.toml"
          sha256="$(sed -n "s/^\"${archive}\" = \"\([0-9a-f]\{64\}\)\"$/\1/p" release-assets/checksum.toml)"
          test -n "$sha256"
          (cd "$verification_dir" && printf '%s  %s\n' "$sha256" "$archive" | sha256sum --check)
          tar -xzf "$verification_dir/$archive" -C "$verification_dir"
          mapfile -t modules < <(find "$verification_dir" -type f -name libtinyflows_module.so)
          test "${#modules[@]}" -eq 1
          TINYFLOWS_MODULE_ARTIFACT="${modules[0]}" bash scripts/verify-module-artifact.sh

      - name: Publish verified module release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish-rust.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false
