name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.120.0

      - name: Check the workspace at its declared minimum compiler version
        run: cargo check --locked --workspace --all-features

  rust-sdk:
    name: Rust SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # This job executes repo code (cargo build/test); don't persist the
          # token in git config.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check the published crate carries no storage git dependency
        run: scripts/check-published-crate.sh

      - name: Check storage port users do not link engine crates
        run: scripts/check-storage-engine-free.sh

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy all features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy the schedule-only drivers build
        run: cargo clippy -p tinyflows-drivers --all-targets --no-default-features --features schedule -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Build all features
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test

      - name: Test all features
        run: cargo test --all-features

      - name: Verify compiled workflow module
        run: bash scripts/verify-module-artifact.sh

      - name: Test the schedule-only drivers build
        # The cron store must build and pass without the engine.
        run: cargo test -p tinyflows-drivers --no-default-features --features schedule

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        # Unit tests live in *_tests.rs files, which cargo-llvm-cov excludes by
        # default. Include them to preserve the coverage gate's historical
        # semantics while still excluding dependencies, build output, and
        # standalone integration-test sources.
        run: >-
          cargo llvm-cov --all-features --workspace --summary-only
          --no-default-ignore-filename-regex
          --ignore-filename-regex
          '(/rustc/|/target/|/.cargo/(registry|git)/|/.rustup/toolchains/|/(tests|examples|benches)/)'
          --fail-under-lines 90
